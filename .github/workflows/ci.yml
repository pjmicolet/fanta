name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple clang)
            os: macos-latest
            cmake_args: ""
          - name: Linux (GCC 14)
            os: ubuntu-24.04
            cmake_args: -DCMAKE_CXX_COMPILER=g++-14
          - name: Sanitizers (macOS)
            os: macos-latest
            cmake_args: -DFANTA_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-14 libsdl2-dev libncurses-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2
      # -Werror, except unused-variable: the parser's unused expect() bindings
      # are tracked in #46. Drop the exception once that lands.
      - name: Configure
        run: >
          cmake -S . -B build ${{ matrix.cmake_args }}
          -DFANTA_WARNINGS_AS_ERRORS=ON -DCMAKE_CXX_FLAGS=-Wno-error=unused-variable
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
